<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<script src="http://static.robotwebtools.org/threejs/current/three.min.js"></script>
<!--script src="http://static.robotwebtools.org/ColladaAnimationCompress/0.0.1/ColladaLoader2.min.js"></script-->
<script src="http://static.robotwebtools.org/EventEmitter2/current/eventemitter2.min.js"></script>
<script src="http://static.robotwebtools.org/roslibjs/current/roslib.js"></script>
<script src="http://static.robotwebtools.org/ros3djs/current/ros3d.js"></script>

<script>
  function init() {
    var ros = new ROSLIB.Ros({
      url : 'ws://192.168.1.253:9090'
    });

    ros.on('connection', function() { 
        console.log('Connected to websocket server.');

        var imageTopic = new ROSLIB.Topic({
        ros : ros,
        name : '/thermal/image/compressed',
        messageType : 'sensor_msgs/CompressedImage'
        });
        
        // 구독 후 이미지 디스플레이
        imageTopic.subscribe(function(message) 
        {
          console.log(message);
            document.getElementById('left_stream1').src = "data:image/png;base64," + message.data;
            
        });
    });


     
  }
</script>
</head>

<body onload="init()">
  <div>
    <img id="left_stream1" src="">
  </div>
</body>
</html>
